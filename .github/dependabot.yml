version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "type:ops"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # Major version bumps (better-sqlite3, vitest, typescript) break builds.
    # Allow minor + patch only; evaluate majors manually.
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      patch-and-minor:
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "type:ops"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
