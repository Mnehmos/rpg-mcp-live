name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: CI / required
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Reject forbidden tracked files
        run: node tools/ci/check-forbidden-files.mjs

      - name: Verify PR metadata
        run: node tools/ci/verify-pr-metadata.mjs

      - name: Typecheck and verify content pack
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Two-service HTTP smoke
        run: npm run smoke:http
