name: Nightly verification

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  verify:
    name: Nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.18.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Reject forbidden tracked files
        run: node tools/ci/check-forbidden-files.mjs

      - name: Typecheck and verify content pack
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Two-service HTTP smoke
        run: npm run smoke:http

      # After #22 lands, uncomment:
      # - name: Invariant harness
      #   run: npm run test:invariants
      # - name: Deterministic gauntlet
      #   run: npm run test:gauntlet:ci

      - name: Dependency audit (informational)
        run: npm audit --audit-level=high || true
