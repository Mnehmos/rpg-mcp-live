name: Nightly verification

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  verify:
    name: Nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Reject forbidden tracked files
        run: node tools/ci/check-forbidden-files.mjs

      - name: Typecheck and verify content pack
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Two-service HTTP smoke
        run: npm run smoke:http

      - name: Invariant harness
        run: npm run test:invariants
      - name: Deterministic gauntlet
        run: npm run test:gauntlet:ci

      - name: Dependency audit (informational)
        run: npm audit --audit-level=high || true
