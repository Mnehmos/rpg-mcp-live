name: Deploy to production

# Production remains intentionally blocked until the owner enables the
# production GitHub environment variable. The workflow consumes only the
# successful staging manifest and deploys the same exact SHA.
on:
  workflow_run:
    workflows: ["Deploy to staging"]
    types: [completed]

permissions:
  contents: write
  deployments: write
  actions: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      vars.RAILWAY_PRODUCTION_PROMOTION_ENABLED == 'true'
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      EXPECTED_REPOSITORY: Mnehmos/rpg-mcp-live

    steps:
      - name: Download the successful staging manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-manifest-${{ env.SHA }}
          path: staging-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify staging manifest and exact SHA
        run: |
          jq -e --arg sha "$SHA" '
            .environment == "staging" and
            .gitSha == $sha and
            (.engineDeploymentId | type == "string") and
            (.webDeploymentId | type == "string") and
            .engineHealth == "pass" and
            .webHealth == "pass" and
            .smoke == "pass"
          ' staging-manifest/deployment-manifest.json >/dev/null

      - name: Checkout exact staging-proven SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.18.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and verify content pack
        run: npm run check

      - name: Build
        run: npm run build

      # Engine is intentionally first: web health depends on private engine reachability.
      - name: Deploy engine to Railway production
        id: engine
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: production
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_ENGINE_SERVICE_ID }}
          RAILWAY_COMMIT_SHA: ${{ env.SHA }}
          RAILWAY_EXPECTED_REPOSITORY: ${{ env.EXPECTED_REPOSITORY }}
          RAILWAY_PRODUCTION_PROMOTION_ENABLED: ${{ vars.RAILWAY_PRODUCTION_PROMOTION_ENABLED }}
        run: npx tsx tools/railway-deploy.ts

      - name: Verify engine deployment SHA
        run: test "${{ steps.engine.outputs.railway_commit_sha }}" = "$SHA"

      - name: Wait for engine health and capture pack evidence
        env:
          ENGINE_PRODUCTION_URL: ${{ vars.ENGINE_PRODUCTION_URL }}
        run: |
          for i in $(seq 1 60); do
            resp=$(curl -fsS "$ENGINE_PRODUCTION_URL/health" || true)
            if echo "$resp" | jq -e '.status == "ok"' >/dev/null; then
              echo "$resp" | jq '{status,service,environment,rules,toolCount,openRouter:{enabled:.openRouter.enabled}}'
              echo "ENGINE_PACK_HASH=$(echo "$resp" | jq -r '.rules.packHash')" >> "$GITHUB_ENV"
              echo "ENGINE_PACK_VERSION=$(echo "$resp" | jq -r '.rules.packVersion')" >> "$GITHUB_ENV"
              echo "ENGINE_TOOL_COUNT=$(echo "$resp" | jq -r '.toolCount')" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Engine production did not become healthy in 5 minutes"
          exit 1

      - name: Deploy web to Railway production
        id: web
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: production
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_COMMIT_SHA: ${{ env.SHA }}
          RAILWAY_EXPECTED_REPOSITORY: ${{ env.EXPECTED_REPOSITORY }}
          RAILWAY_PRODUCTION_PROMOTION_ENABLED: ${{ vars.RAILWAY_PRODUCTION_PROMOTION_ENABLED }}
        run: npx tsx tools/railway-deploy.ts

      - name: Verify web deployment SHA
        run: test "${{ steps.web.outputs.railway_commit_sha }}" = "$SHA"

      - name: Wait for web health and engine reachability
        env:
          WEB_PRODUCTION_URL: ${{ vars.WEB_PRODUCTION_URL }}
        run: |
          for i in $(seq 1 60); do
            resp=$(curl -fsS "$WEB_PRODUCTION_URL/api/health" || true)
            if echo "$resp" | jq -e '.status == "ok" and .integrations.lanternEngine == true' >/dev/null; then
              echo "$resp" | jq '{status,service,environment,integrations:{lanternEngine:.integrations.lanternEngine}}'
              exit 0
            fi
            sleep 5
          done
          echo "::error::Web production did not become healthy or reach the engine in 5 minutes"
          exit 1

      - name: Run two-service HTTP smoke
        run: npm run smoke:http

      - name: Run invariant suite
        run: npm run test:invariants

      - name: Run deterministic evaluation suite
        run: npm run test:gauntlet:ci

      - name: Generate release material without mutating main
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          node tools/ci/generate-changelog.mjs --version "$TAG" --fail-empty > release-body.md
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Generated release material for $TAG"

      - name: Tag the exact production SHA
        run: |
          git tag -a "$RELEASE_TAG" "$SHA" -m "Production release $RELEASE_TAG from $SHA"
          git push origin "$RELEASE_TAG"

      - name: Write production deployment manifest
        run: |
          node tools/ci/write-deployment-manifest.mjs \
            --env production \
            --git-sha "$SHA" \
            --git-ref main \
            --engine-deployment-id "${{ steps.engine.outputs.deployment_id }}" \
            --web-deployment-id "${{ steps.web.outputs.deployment_id }}" \
            --engine-railway-commit-sha "${{ steps.engine.outputs.railway_commit_sha }}" \
            --web-railway-commit-sha "${{ steps.web.outputs.railway_commit_sha }}" \
            --pack-version "$ENGINE_PACK_VERSION" \
            --pack-hash "$ENGINE_PACK_HASH" \
            --tool-count "$ENGINE_TOOL_COUNT" \
            --gauntlet-version open-ended-gauntlet-v1 \
            --engine-health pass \
            --web-health pass \
            --smoke pass \
            --output deployment-manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@de2c0eb89ae2a8a8d8d0d6ea84c2ffe7749e4149 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-body.md
          files: |
            deployment-manifest.json
