name: Verify production deployment and publish release

# Railway native GitHub autodeploy owns production. This workflow runs after
# aggregate deployment success or a Railway service commit-status success
# event. It never starts a long-lived verifier on a nonterminal deployment
# event, because Railway Wait for CI would otherwise deadlock the deployment.
on:
  deployment_status:
  status:

permissions:
  contents: read
  deployments: read
  statuses: read

concurrency:
  group: verify-production-${{ github.event.deployment.sha || github.event.sha }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify native production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    # A status event is only an eligibility signal; the first step resolves an
    # exact production deployment. A status from the other environment becomes
    # a successful no-op rather than a failed verifier.
    if: >
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'RPG MCP Live / production' &&
       github.event.deployment.ref == github.event.deployment.sha &&
       github.event.deployment.creator.login == 'railway-app[bot]') ||
      (github.event_name == 'status' &&
       github.event.state == 'success' &&
       github.event.sender.login == 'railway-app[bot]' &&
       (github.event.context == 'RPG MCP Live - mnehmos-rpg-mcp' ||
        github.event.context == 'RPG MCP Live - rpg-mcp-live'))
    env:
      SHA: ${{ github.event.deployment.sha || github.event.sha }}
      DEPLOYMENT_ID: ${{ github.event.deployment.id || '' }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment || 'RPG MCP Live / production' }}
      DEPLOYMENT_REF: ${{ github.event.deployment.ref || '' }}
      DEPLOYMENT_CREATOR: ${{ github.event.deployment.creator.login || '' }}
      STATUS_TARGET_URL: ${{ github.event.target_url || '' }}
      EXPECTED_ENVIRONMENT: RPG MCP Live / production

    steps:
      - name: Checkout verifier tools at the event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact native production deployment for event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/native-railway-evidence"
          mkdir -p "$evidence_dir"
          if [ "$GITHUB_EVENT_NAME" = "deployment_status" ]; then
            gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID" \
              > "$evidence_dir/deployment.json"
          else
            if [ -z "$STATUS_TARGET_URL" ]; then
              echo "SKIP=true" >> "$GITHUB_ENV"
              echo "Railway status event has no target URL; treating it as an unrelated event."
              exit 0
            fi
            gh api --method GET --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/deployments" \
              -f sha="$SHA" -f environment="$EXPECTED_ENVIRONMENT" -f per_page=100 \
              > "$evidence_dir/deployments.json"
            set +e
            deployment=$(node tools/ci/native-railway-evidence.mjs resolve \
              --deployments "$evidence_dir/deployments.json" \
              --sha "$SHA" \
              --environment "$EXPECTED_ENVIRONMENT" \
              --target-url "$STATUS_TARGET_URL")
            resolve_status=$?
            set -e
            if [ "$resolve_status" -eq 2 ]; then
              echo "SKIP=true" >> "$GITHUB_ENV"
              echo "No native production deployment exists for status-event SHA $SHA; this event belongs to another environment."
              exit 0
            fi
            if [ "$resolve_status" -ne 0 ]; then
              echo "::error::Could not resolve the native production deployment"
              exit 1
            fi
            printf '%s\n' "$deployment" > "$evidence_dir/deployment.json"
          fi

          echo "SKIP=false" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ID=$(jq -r '.id' "$evidence_dir/deployment.json")" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ENVIRONMENT=$(jq -r '.environment' "$evidence_dir/deployment.json")" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_REF=$(jq -r '.ref' "$evidence_dir/deployment.json")" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_CREATOR=$(jq -r '.creator.login' "$evidence_dir/deployment.json")" >> "$GITHUB_ENV"

      - name: Verify Railway deployment identity
        if: env.SKIP != 'true'
        run: |
          test "${#SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$DEPLOYMENT_ENVIRONMENT" = "RPG MCP Live / production"
          test "$DEPLOYMENT_REF" = "$SHA"
          test "$DEPLOYMENT_CREATOR" = "railway-app[bot]"

      - name: Wait for native Railway deployment or service statuses
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/native-railway-evidence"
          mkdir -p "$evidence_dir"
          for attempt in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID" \
              > "$evidence_dir/deployment.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses?per_page=100" \
              > "$evidence_dir/deployment-statuses.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=100" \
              > "$evidence_dir/commit-statuses.json"

            set +e
            result=$(node tools/ci/native-railway-evidence.mjs check \
              --deployment "$evidence_dir/deployment.json" \
              --deployment-statuses "$evidence_dir/deployment-statuses.json" \
              --commit-statuses "$evidence_dir/commit-statuses.json" \
              --sha "$SHA" \
              --environment "$DEPLOYMENT_ENVIRONMENT" \
              --deployment-id "$DEPLOYMENT_ID")
            result_status=$?
            set -e

            if [ "$result_status" -eq 0 ]; then
              printf '%s\n' "$result" > native-railway-evidence.json
              echo "RAILWAY_DEPLOYMENT_IDS=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
              echo "Railway native production deployment $DEPLOYMENT_ID is verified for $SHA."
              exit 0
            fi
            if [ "$result_status" -eq 1 ]; then
              echo "::error::Native Railway production evidence is invalid or failed"
              exit 1
            fi
            if [ "$result_status" -ne 2 ]; then
              echo "::error::Native Railway production evidence checker failed unexpectedly"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Native Railway production did not reach a verified state"
              exit 1
            fi
            echo "Native Railway production is not ready (attempt $attempt/60); waiting 10 seconds."
            sleep 10
          done

      - name: Read engine health
        if: env.SKIP != 'true'
        env:
          REFERENCE_ENGINE_PRODUCTION_URL: ${{ vars.REFERENCE_ENGINE_PRODUCTION_URL }}
        run: |
          for i in $(seq 1 60); do
            resp=$(curl -fsS "$REFERENCE_ENGINE_PRODUCTION_URL/health" || true)
            if echo "$resp" | jq -e \
              --arg sha "$SHA" \
              '.status == "ok" and .service == "rpg-mcp" and .environment == "production" and .deployment.commitSha == $sha' >/dev/null; then
              printf '%s\n' "$resp" > engine-health.json
              echo "$resp" | jq '{status,service,environment,rules,toolCount}'
              exit 0
            fi
            sleep 5
          done
          echo "::error::Native production engine did not become healthy"
          exit 1

      - name: Read web health and engine reachability
        if: env.SKIP != 'true'
        env:
          WEB_PRODUCTION_URL: ${{ vars.WEB_PRODUCTION_URL }}
        run: |
          for i in $(seq 1 60); do
            resp=$(curl -fsS "$WEB_PRODUCTION_URL/api/health" || true)
            if echo "$resp" | jq -e \
              --arg sha "$SHA" \
              '.status == "ok" and .service == "rpg-mcp-live-web" and .environment == "production" and .deployment.commitSha == $sha and
                .integrations.referenceEngine == true and .engine.service == "rpg-mcp" and
               .engine.environment == "production" and .engine.deployment.commitSha == $sha' >/dev/null; then
              printf '%s\n' "$resp" > web-health.json
               echo "$resp" | jq '{status,service,environment,integrations:{referenceEngine:.integrations.referenceEngine}}'
              exit 0
            fi
            sleep 5
          done
          echo "::error::Native production web did not become healthy or reach the engine"
          exit 1

      - name: Create or verify SHA-bound release evidence
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_PROMOTION_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::PRODUCTION_PROMOTION_TOKEN is required for release recording"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          TAG=$(node tools/ci/production-release-evidence.mjs tag --version "$VERSION" --sha "$SHA")
          EVIDENCE_DIR=existing-release-evidence
          collect_evidence() {
            local dir="$1"
            mkdir -p "$dir"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$dir/tag-ref.json" 2>/dev/null; then
              local tag_type tag_object_sha
              tag_type=$(jq -r '.object.type' "$dir/tag-ref.json")
              tag_object_sha=$(jq -r '.object.sha' "$dir/tag-ref.json")
              if [ "$tag_type" = tag ]; then
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" > "$dir/tag-object.json"
              fi
            else
              rm -f "$dir/tag-ref.json"
            fi

            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$dir/release-pages.json"
            local release_count
            release_count=$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$dir/release-pages.json")
            test "$release_count" -le 1
            if [ "$release_count" -eq 1 ]; then
              jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)][0]' \
                "$dir/release-pages.json" > "$dir/release.json"
              local asset_count asset_id
              asset_count=$(jq '[.assets[]? | select(.name == "deployment-manifest.json")] | length' "$dir/release.json")
              test "$asset_count" -le 1
              if [ "$asset_count" -eq 1 ]; then
                asset_id=$(jq -r '.assets[] | select(.name == "deployment-manifest.json") | .id' "$dir/release.json")
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  -H 'Accept: application/octet-stream' > "$dir/deployment-manifest.json"
              fi
            fi
          }

          collect_evidence "$EVIDENCE_DIR"

          plan=$(node tools/ci/production-release-evidence.mjs assess \
            --version "$VERSION" --sha "$SHA" --evidence-dir "$EVIDENCE_DIR")
          if [ "$plan" = reuse ]; then
            cp "$EVIDENCE_DIR/deployment-manifest.json" deployment-manifest.json
            echo "Verified existing release $TAG for $SHA."
          else
            # A partial run may already have fetched this exact remote tag.
            # Remove only the local checkout ref so the changelog starts at the
            # previous published release; the immutable remote tag is untouched.
            git tag --delete "$TAG" >/dev/null 2>&1 || true
            node tools/ci/generate-changelog.mjs --version "$TAG" --fail-empty > release-body.md
            jq -n \
              --arg ids "$RAILWAY_DEPLOYMENT_IDS" \
              --arg sha "$SHA" \
              --arg ref "$DEPLOYMENT_REF" \
              --arg environment "$DEPLOYMENT_ENVIRONMENT" \
              '{controller:"railway-native-github-autodeploy",deploymentIds:($ids|split(",")),sha:$sha,gitSha:$sha,ref:$ref,environment:$environment,engineHealth:"pass",webHealth:"pass",release:"pass"}' \
              > deployment-manifest.json
            if [ "$plan" = create ]; then
              tag_object_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
                -f tag="$TAG" -f message="Production release $TAG from $SHA" \
                -f object="$SHA" -f type=commit --jq '.sha')
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$tag_object_sha" >/dev/null
            fi
            if [ "$plan" = publish-draft ]; then
              gh release upload "$TAG" deployment-manifest.json --clobber
              gh release edit "$TAG" --verify-tag --title "$TAG" \
                --notes-file release-body.md --draft=false
            else
              gh release create "$TAG" --verify-tag --title "$TAG" \
                --notes-file release-body.md deployment-manifest.json
            fi

            MAX_RELEASE_READ_ATTEMPTS=5
            for attempt in $(seq 1 "$MAX_RELEASE_READ_ATTEMPTS"); do
              PUBLISHED_DIR="published-release-evidence-$attempt"
              collect_evidence "$PUBLISHED_DIR"
              action=$(node tools/ci/production-release-evidence.mjs post-publication \
                --version "$VERSION" --sha "$SHA" --evidence-dir "$PUBLISHED_DIR" \
                --attempt "$attempt" --max-attempts "$MAX_RELEASE_READ_ATTEMPTS")
              if [ "$action" = complete ]; then
                break
              fi
              echo "GitHub release evidence is not visible yet (attempt $attempt/$MAX_RELEASE_READ_ATTEMPTS); retrying."
              sleep 2
            done
          fi

      - name: Upload production release evidence
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release-evidence-${{ env.SHA }}
          path: |
            deployment-manifest.json
            native-railway-evidence.json
            engine-health.json
            web-health.json
          retention-days: 30
