name: Codex review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Subscription Codex review gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout trusted review gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Wait for subscription-backed Codex review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_REPOSITORY: ${{ github.repository }}
          CODEX_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODEX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/ci/wait-for-codex-review.mjs
