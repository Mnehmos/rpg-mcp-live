name: Codex review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Wait for subscription-backed Codex review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_REPOSITORY: ${{ github.repository }}
          CODEX_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/wait-for-codex-review.mjs
