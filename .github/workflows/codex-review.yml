name: Codex review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # GitHub resolves issue_comment workflows from the default branch, so a clean
  # connector result can safely refresh a failed or expired polling run.
  # pull_request_review is intentionally omitted because it executes against
  # the PR merge ref. Later inline findings remain a separate hard blocker via
  # the main ruleset's required review-thread resolution rule.
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # Irrelevant comments get a unique group so their skipped runs cannot cancel
  # the active gate for this pull request.
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name == 'issue_comment' && github.event.comment.user.login != 'chatgpt-codex-connector[bot]' && github.run_id || 'gate' }}
  cancel-in-progress: true

jobs:
  review:
    name: Subscription Codex review gate
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')) &&
      (github.event_name == 'issue_comment' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout trusted review gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Wait for subscription-backed Codex review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_REPOSITORY: ${{ github.repository }}
          CODEX_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CODEX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODEX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/ci/wait-for-codex-review.mjs
