name: Verify staging and promote production

# Railway native GitHub autodeploy owns staging. This workflow runs only after
# Railway reports a successful staging deployment. It verifies both services,
# runs the deterministic evaluation, then advances the production ref directly
# to the verified SHA; it never calls Railway's deployment API.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: verify-staging-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  verify-and-promote:
    name: Verify staging and promote exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    # Railway records the connected GitHub deployment ref as the full SHA.
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'RPG MCP Live / staging' &&
      github.event.deployment.ref == github.event.deployment.sha &&
      github.event.deployment.creator.login == 'railway-app[bot]'
    env:
      SHA: ${{ github.event.deployment.sha }}
      DEPLOYMENT_ID: ${{ github.event.deployment.id }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
      DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
      DEPLOYMENT_CREATOR: ${{ github.event.deployment.creator.login }}

    steps:
      - name: Checkout the Railway deployment SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Verify Railway deployment identity
        run: |
          test "${#SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$DEPLOYMENT_ENVIRONMENT" = "RPG MCP Live / staging"
          test "$DEPLOYMENT_REF" = "$SHA"
          test "$DEPLOYMENT_CREATOR" = "railway-app[bot]"

      - name: Confirm native Railway deployment status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            --jq '[.[] | select(.creator.login == "railway-app[bot]")][0].state // ""')
          test "$state" = "success"
          echo "RAILWAY_DEPLOYMENT_IDS=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "Railway native staging deployment $DEPLOYMENT_ID succeeded for $SHA."

      - name: Set up Node for staging evaluation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.x
          cache: npm

      - name: Install evaluation dependencies
        run: npm ci

      - name: Run staging invariant evaluation
        run: npm run test:invariants

      - name: Run staging deterministic evaluation
        run: npm run test:gauntlet:ci

      - name: Read engine health
        env:
          ENGINE_STAGING_URL: ${{ vars.ENGINE_STAGING_URL }}
        run: |
          for i in $(seq 1 60); do
            resp=$(curl -fsS "$ENGINE_STAGING_URL/health" || true)
            if echo "$resp" | jq -e \
              '.status == "ok" and .service == "lantern-engine" and .environment == "staging"' >/dev/null; then
              printf '%s\n' "$resp" > engine-health.json
              echo "$resp" | jq '{status,service,environment,rules,toolCount}'
              exit 0
            fi
            sleep 5
          done
          echo "::error::Native staging engine did not become healthy"
          exit 1

      - name: Read web health and engine reachability
        env:
          WEB_STAGING_URL: ${{ vars.WEB_STAGING_URL }}
        run: |
          for i in $(seq 1 60); do
            resp=$(curl -fsS "$WEB_STAGING_URL/api/health" || true)
            if echo "$resp" | jq -e \
              '.status == "ok" and .service == "rpg-mcp-live-web" and .environment == "staging" and
               .integrations.lanternEngine == true and .engine.service == "lantern-engine" and
               .engine.environment == "staging"' >/dev/null; then
              printf '%s\n' "$resp" > web-health.json
              echo "$resp" | jq '{status,service,environment,integrations:{lanternEngine:.integrations.lanternEngine}}'
              exit 0
            fi
            sleep 5
          done
          echo "::error::Native staging web did not become healthy or reach the engine"
          exit 1

      - name: Promote production ref to the verified SHA
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_PROMOTION_TOKEN }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          if [ "$current" != "$SHA" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/production" \
              -f sha="$SHA" -F force=true --jq '.object.sha'
            echo "Production ref advanced directly to $SHA without creating a commit."
          else
            echo "Production ref already points at $SHA."
          fi

      - name: Write staging promotion evidence
        env:
          ENGINE_STAGING_URL: ${{ vars.ENGINE_STAGING_URL }}
          WEB_STAGING_URL: ${{ vars.WEB_STAGING_URL }}
        run: |
          jq -n \
            --arg ids "$RAILWAY_DEPLOYMENT_IDS" \
            --arg sha "$SHA" \
            --arg ref "$DEPLOYMENT_REF" \
            --arg environment "$DEPLOYMENT_ENVIRONMENT" \
            --arg creator "$DEPLOYMENT_CREATOR" \
            --arg engineUrl "$ENGINE_STAGING_URL" \
            --arg webUrl "$WEB_STAGING_URL" \
            '{controller:"railway-native-github-autodeploy",deploymentIds:($ids|split(",")),sha:$sha,ref:$ref,environment:$environment,creator:$creator,engineHealth:"pass",webHealth:"pass",invariants:"pass",evaluation:"pass",productionRef:$sha,engineUrl:$engineUrl,webUrl:$webUrl}' \
            > staging-promotion-evidence.json

      - name: Upload staging promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-promotion-evidence-${{ env.SHA }}
          path: |
            staging-promotion-evidence.json
            engine-health.json
            web-health.json
          retention-days: 30
