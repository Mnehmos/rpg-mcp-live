name: Verify staging and promote production

# Railway native GitHub autodeploy owns staging. This workflow runs only after
# the aggregate staging deployment reports success. A service commit-status
# success can describe the still-running previous deployment while Railway's
# Wait for CI gate is holding the new deployment; waking the verifier from
# that event can publish a failing check and cause Railway to skip the release.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read
  statuses: read

concurrency:
  group: verify-staging-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  verify-and-promote:
    name: Verify staging and promote exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'RPG MCP Live / staging' &&
      github.event.deployment.ref == github.event.deployment.sha &&
      github.event.deployment.creator.login == 'railway-app[bot]'
    env:
      SHA: ${{ github.event.deployment.sha }}
      DEPLOYMENT_ID: ${{ github.event.deployment.id }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
      DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
      DEPLOYMENT_CREATOR: ${{ github.event.deployment.creator.login }}

    steps:
      - name: Checkout verifier tools at the event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Resolve exact native staging deployment for event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/native-railway-evidence"
          mkdir -p "$evidence_dir"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID" \
            > "$evidence_dir/deployment.json"

          echo "DEPLOYMENT_ID=$(jq -r '.id' "$evidence_dir/deployment.json")" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ENVIRONMENT=$(jq -r '.environment' "$evidence_dir/deployment.json")" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_REF=$(jq -r '.ref' "$evidence_dir/deployment.json")" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_CREATOR=$(jq -r '.creator.login' "$evidence_dir/deployment.json")" >> "$GITHUB_ENV"

      - name: Verify Railway deployment identity
        run: |
          test "${#SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$DEPLOYMENT_ENVIRONMENT" = "RPG MCP Live / staging"
          test "$DEPLOYMENT_REF" = "$SHA"
          test "$DEPLOYMENT_CREATOR" = "railway-app[bot]"

      - name: Wait for native Railway deployment or service statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/native-railway-evidence"
          mkdir -p "$evidence_dir"
          for attempt in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID" \
              > "$evidence_dir/deployment.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses?per_page=100" \
              > "$evidence_dir/deployment-statuses.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=100" \
              > "$evidence_dir/commit-statuses.json"

            set +e
            result=$(node tools/ci/native-railway-evidence.mjs check \
              --deployment "$evidence_dir/deployment.json" \
              --deployment-statuses "$evidence_dir/deployment-statuses.json" \
              --commit-statuses "$evidence_dir/commit-statuses.json" \
              --sha "$SHA" \
              --environment "$DEPLOYMENT_ENVIRONMENT" \
              --deployment-id "$DEPLOYMENT_ID")
            result_status=$?
            set -e

            if [ "$result_status" -eq 0 ]; then
              printf '%s\n' "$result" > native-railway-evidence.json
              echo "RAILWAY_DEPLOYMENT_IDS=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
              echo "Railway native staging deployment $DEPLOYMENT_ID is verified for $SHA."
              exit 0
            fi
            if [ "$result_status" -eq 1 ]; then
              echo "::error::Native Railway staging evidence is invalid or failed"
              exit 1
            fi
            if [ "$result_status" -ne 2 ]; then
              echo "::error::Native Railway staging evidence checker failed unexpectedly"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Native Railway staging did not reach a verified state"
              exit 1
            fi
            echo "Native Railway staging is not ready (attempt $attempt/60); waiting 10 seconds."
            sleep 10
          done

      - name: Resolve reference engine main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "REFERENCE_ENGINE_SHA=$(gh api repos/Mnehmos/mnehmos.rpg.mcp/git/ref/heads/main --jq '.object.sha')" >> "$GITHUB_ENV"

      - name: Read engine health
        env:
          REFERENCE_ENGINE_STAGING_URL: ${{ vars.REFERENCE_ENGINE_STAGING_URL }}
        run: |
          for i in $(seq 1 60); do
            resp=$(curl -fsS "$REFERENCE_ENGINE_STAGING_URL/health" || true)
            if echo "$resp" | jq -e \
              --arg sha "$REFERENCE_ENGINE_SHA" \
              '.status == "ok" and .service == "rpg-mcp" and .environment == "staging" and .deployment.commitSha == $sha' >/dev/null; then
              printf '%s\n' "$resp" > engine-health.json
              echo "$resp" | jq '{status,service,environment,rules,toolCount}'
              exit 0
            fi
            sleep 5
          done
          echo "::error::Native staging engine did not become healthy"
          exit 1

      - name: Read web health and engine reachability
        env:
          WEB_STAGING_URL: ${{ vars.WEB_STAGING_URL }}
        run: |
          for i in $(seq 1 60); do
            resp=$(curl -fsS "$WEB_STAGING_URL/api/health" || true)
            if echo "$resp" | jq -e \
              --arg sha "$SHA" \
              --arg engineSha "$REFERENCE_ENGINE_SHA" \
              '.status == "ok" and .service == "rpg-mcp-live-web" and .environment == "staging" and .deployment.commitSha == $sha and
                .integrations.referenceEngine == true and .engine.service == "rpg-mcp" and
               .engine.environment == "staging" and .engine.deployment.commitSha == $engineSha' >/dev/null; then
              printf '%s\n' "$resp" > web-health.json
              echo "$resp" | jq '{status,service,environment,integrations:{referenceEngine:.integrations.referenceEngine}}'
              exit 0
            fi
            sleep 5
          done
          echo "::error::Native staging web did not become healthy or reach the engine"
          exit 1

      - name: Promote production ref to the verified SHA
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_PROMOTION_TOKEN }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          if [ "$current" != "$SHA" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/production" \
              -f sha="$SHA" -F force=true --jq '.object.sha'
            echo "Production ref advanced directly to $SHA without creating a commit."
          else
            echo "Production ref already points at $SHA."
          fi

      - name: Write staging promotion evidence
        env:
          REFERENCE_ENGINE_STAGING_URL: ${{ vars.REFERENCE_ENGINE_STAGING_URL }}
          WEB_STAGING_URL: ${{ vars.WEB_STAGING_URL }}
        run: |
          jq -n \
            --arg ids "$RAILWAY_DEPLOYMENT_IDS" \
            --arg sha "$SHA" \
            --arg ref "$DEPLOYMENT_REF" \
             --arg environment "$DEPLOYMENT_ENVIRONMENT" \
             --arg creator "$DEPLOYMENT_CREATOR" \
             --arg referenceSha "$REFERENCE_ENGINE_SHA" \
             --arg referenceEngineUrl "$REFERENCE_ENGINE_STAGING_URL" \
             --arg webUrl "$WEB_STAGING_URL" \
             '{controller:"railway-native-github-autodeploy",deploymentIds:($ids|split(",")),sha:$sha,ref:$ref,environment:$environment,creator:$creator,referenceEngineSha:$referenceSha,referenceEngineHealth:"pass",webHealth:"pass",invariants:"pass",evaluation:"pass",productionRef:$sha,referenceEngineUrl:$referenceEngineUrl,webUrl:$webUrl}' \
            > staging-promotion-evidence.json

      - name: Upload staging promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-promotion-evidence-${{ env.SHA }}
          path: |
            staging-promotion-evidence.json
            native-railway-evidence.json
            engine-health.json
            web-health.json
          retention-days: 30
